<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATH0005 Algebra 1 — Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.min.js"></script>
<style>
  :root {
    --bg: #0f0f14;
    --surface: #17171f;
    --card-front: #1c1c28;
    --card-back: #141420;
    --accent: #7c6ef7;
    --accent2: #f7c26e;
    --accent3: #6ef7b8;
    --text: #e8e8f0;
    --muted: #888899;
    --border: #2a2a38;
    --tag-matrix: #7c6ef7;
    --tag-subspace: #6ef7b8;
    --tag-linear: #f7a26e;
    --tag-eigen: #f76e8f;
    --tag-ortho: #6ec8f7;
    --tag-proof: #f7e26e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
    background-image:
      radial-gradient(ellipse 60% 40% at 10% 20%, rgba(124,110,247,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 30% at 90% 80%, rgba(110,247,184,0.06) 0%, transparent 60%);
  }

  /* ── Header ────────────────────────────────────────────────────────── */
  header {
    text-align: center;
    margin-bottom: 32px;
    width: 100%;
    max-width: 760px;
  }

  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.9;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(24px, 4vw, 36px);
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  h1 em {
    font-style: italic;
    color: var(--accent2);
  }

  .subtitle {
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  /* ── Filter bar ─────────────────────────────────────────────────────── */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 28px;
    width: 100%;
    max-width: 760px;
  }

  .filter-btn {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filter-btn[data-topic="subspaces"].active { background: var(--tag-subspace); border-color: var(--tag-subspace); color: #0f0f14; }
  .filter-btn[data-topic="linear"].active { background: var(--tag-linear); border-color: var(--tag-linear); color: #0f0f14; }
  .filter-btn[data-topic="eigen"].active { background: var(--tag-eigen); border-color: var(--tag-eigen); color: #fff; }
  .filter-btn[data-topic="ortho"].active { background: var(--tag-ortho); border-color: var(--tag-ortho); color: #0f0f14; }
  .filter-btn[data-topic="proof"].active { background: var(--tag-proof); border-color: var(--tag-proof); color: #0f0f14; }

  /* ── Progress bar ───────────────────────────────────────────────────── */
  .progress-wrap {
    width: 100%;
    max-width: 760px;
    margin-bottom: 20px;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-family: 'JetBrains Mono', monospace;
  }

  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* ── Card ───────────────────────────────────────────────────────────── */
  .card-container {
    width: 100%;
    max-width: 760px;
    perspective: 1400px;
    margin-bottom: 28px;
  }

  .card {
    position: relative;
    width: 100%;
    min-height: 320px;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
    cursor: pointer;
  }

  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    width: 100%;
    min-height: 320px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 16px;
    padding: 36px 40px;
    display: flex;
    flex-direction: column;
  }

  .card-front {
    background: var(--card-front);
    border: 1px solid var(--border);
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .card-back {
    background: var(--card-back);
    border: 1px solid rgba(124,110,247,0.3);
    transform: rotateY(180deg);
    justify-content: flex-start;
  }

  /* Shimmer line on front */
  .card-front::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
  }

  .card-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-label::before, .card-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .card-front .card-label { width: 100%; }

  .topic-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 16px;
    font-weight: 600;
  }

  .tag-matrices { background: rgba(124,110,247,0.15); color: var(--tag-matrix); border: 1px solid rgba(124,110,247,0.3); }
  .tag-subspaces { background: rgba(110,247,184,0.12); color: var(--tag-subspace); border: 1px solid rgba(110,247,184,0.3); }
  .tag-linear { background: rgba(247,162,110,0.12); color: var(--tag-linear); border: 1px solid rgba(247,162,110,0.3); }
  .tag-eigen { background: rgba(247,110,143,0.12); color: var(--tag-eigen); border: 1px solid rgba(247,110,143,0.3); }
  .tag-ortho { background: rgba(110,200,247,0.12); color: var(--tag-ortho); border: 1px solid rgba(110,200,247,0.3); }
  .tag-proof { background: rgba(247,226,110,0.12); color: var(--tag-proof); border: 1px solid rgba(247,226,110,0.3); }

  .question-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(16px, 2.5vw, 22px);
    line-height: 1.5;
    color: var(--text);
    font-weight: 600;
  }

  .card-back .answer-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .answer-text {
    font-size: 14px;
    line-height: 1.8;
    color: #c8c8e0;
    font-weight: 300;
  }

  .answer-text .highlight {
    color: var(--accent2);
    font-weight: 500;
  }

  .answer-text .formula {
    display: block;
    text-align: center;
    margin: 12px 0;
    padding: 10px 16px;
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
    border-left: 2px solid var(--accent);
    font-size: 15px;
  }

  .hint {
    margin-top: auto;
    padding-top: 12px;
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    border-top: 1px solid var(--border);
  }

  .flip-hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 20px;
    font-style: italic;
  }

  /* ── Controls ───────────────────────────────────────────────────────── */
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 760px;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }

  .btn:hover { background: #22222e; border-color: var(--accent); }
  .btn:active { transform: scale(0.97); }

  .btn-correct {
    background: rgba(110,247,184,0.08);
    border-color: rgba(110,247,184,0.3);
    color: var(--accent3);
  }
  .btn-correct:hover { background: rgba(110,247,184,0.15); }

  .btn-wrong {
    background: rgba(247,110,143,0.08);
    border-color: rgba(247,110,143,0.3);
    color: var(--tag-eigen);
  }
  .btn-wrong:hover { background: rgba(247,110,143,0.15); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .btn-primary:hover { background: #6a5ce6; border-color: #6a5ce6; }

  /* ── Score panel ────────────────────────────────────────────────────── */
  .score-panel {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  .score-item {
    text-align: center;
  }

  .score-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    font-weight: 600;
  }

  .score-num.correct { color: var(--accent3); }
  .score-num.wrong { color: var(--tag-eigen); }
  .score-num.remaining { color: var(--accent); }

  .score-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  /* ── Empty state ────────────────────────────────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-state .big { font-size: 48px; margin-bottom: 12px; }

  /* ── Keyboard hint ──────────────────────────────────────────────────── */
  .keyboard-hint {
    margin-top: 24px;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .key {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
  }

  /* ── Animations ─────────────────────────────────────────────────────── */
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-container { animation: slideIn 0.4s ease; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">MATH0005 · Algebra 1</div>
  <h1>Flashcard <em>Revision</em></h1>
  <div class="subtitle">51 cards · 6 topics · tap to reveal</div>
</header>

<!-- Filter bar -->
<div class="filter-bar">
  <button class="filter-btn active" data-topic="all" onclick="setFilter('all',this)">All cards</button>
  <button class="filter-btn" data-topic="matrices" onclick="setFilter('matrices',this)">Matrices &amp; Systems</button>
  <button class="filter-btn" data-topic="subspaces" onclick="setFilter('subspaces',this)">Subspaces &amp; Dimension</button>
  <button class="filter-btn" data-topic="linear" onclick="setFilter('linear',this)">Linear Maps</button>
  <button class="filter-btn" data-topic="eigen" onclick="setFilter('eigen',this)">Eigenvalues &amp; Det.</button>
  <button class="filter-btn" data-topic="ortho" onclick="setFilter('ortho',this)">Orthogonality</button>
  <button class="filter-btn" data-topic="proof" onclick="setFilter('proof',this)">★ Proofs</button>
</div>

<!-- Progress -->
<div class="progress-wrap">
  <div class="progress-meta">
    <span id="progress-label">Card 1 of 50</span>
    <span id="progress-pct">0%</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<!-- Card -->
<div class="card-container">
  <div class="card" id="card" onclick="flipCard()">
    <div class="card-face card-front" id="card-front"></div>
    <div class="card-face card-back" id="card-back"></div>
  </div>
</div>

<!-- Controls -->
<div class="controls" id="controls">
  <button class="btn btn-wrong" onclick="markWrong()">✗ Still learning</button>
  <button class="btn btn-primary" onclick="nextCard()">→ Skip</button>
  <button class="btn btn-correct" onclick="markCorrect()">✓ Got it</button>
</div>

<div class="score-panel">
  <div class="score-item">
    <div class="score-num correct" id="score-correct">0</div>
    <div class="score-label">Got it</div>
  </div>
  <div class="score-item">
    <div class="score-num remaining" id="score-remaining">50</div>
    <div class="score-label">Remaining</div>
  </div>
  <div class="score-item">
    <div class="score-num wrong" id="score-wrong">0</div>
    <div class="score-label">Learning</div>
  </div>
</div>

<div class="keyboard-hint">
  <span><span class="key">Space</span> flip card</span>
  <span><span class="key">→</span> next</span>
  <span><span class="key">1</span> got it</span>
  <span><span class="key">2</span> still learning</span>
  <span><span class="key">R</span> restart</span>
</div>

<script>
const ALL_CARDS = [
  // ── MATRICES & SYSTEMS ─────────────────────────────────────────────────
  {
    topic: "matrices",
    q: "What is an \\(m \\times n\\) matrix, and what are its row vectors and column vectors?",
    a: "An \\(m \\times n\\) matrix is a rectangular grid of numbers with \\(m\\) rows and \\(n\\) columns. A <span class='highlight'>row vector</span> is a \\(1 \\times n\\) matrix; a <span class='highlight'>column vector</span> is an \\(m \\times 1\\) matrix. The \\((i,j)\\) entry is in row \\(i\\), column \\(j\\).",
  },
  {
    topic: "matrices",
    q: "State the column decomposition: how do you express \\(Ax\\) in terms of the columns of \\(A\\)?",
    a: "If \\(c_1,\\ldots,c_n\\) are the columns of \\(A\\) and \\(x = (x_1,\\ldots,x_n)^T\\), then <span class='formula'>\\(Ax = \\sum_{k=1}^n x_k c_k\\)</span> so \\(Ax\\) is a <span class='highlight'>linear combination of the columns</span> of \\(A\\) with coefficients \\(x_k\\).",
  },
  {
    topic: "matrices",
    q: "What is \\(Ae_j\\)?",
    a: "<span class='formula'>\\(Ae_j = \\text{the }j\\text{th column of }A\\)</span> where \\(e_j\\) is the \\(j\\)th standard basis vector.",
    hint: "Follows from the column decomposition with \\(x = e_j\\)."
  },
  {
    topic: "matrices",
    q: "What is the transpose \\(A^T\\) and what are its key identities?",
    a: "\\((A^T)_{ij} = a_{ji}\\). Key identities: <span class='formula'>\\((A+B)^T = A^T+B^T, \\quad (AB)^T = B^T A^T, \\quad (A^T)^T = A\\)</span>",
  },
  {
    topic: "matrices",
    q: "What are the three elementary row operations?",
    a: "<span class='highlight'>1.</span> Multiply row \\(i\\) by a non-zero scalar \\(\\lambda\\).<br><br><span class='highlight'>2.</span> Add \\(\\lambda\\) times row \\(j\\) to row \\(i\\) (\\(i \\neq j\\)).<br><br><span class='highlight'>3.</span> Swap rows \\(i\\) and \\(j\\).",
    hint: "If \\(r\\) is a row operation then \\(r(A) = r(I_n)A\\)."
  },
  {
    topic: "matrices",
    q: "Define Row Reduced Echelon Form (RREF). What are pivot and free variables?",
    a: "A matrix is in RREF if: (1) zero rows at bottom; (2) leading entry in each non-zero row is 1; (3) each leading entry is the only non-zero in its column; (4) leading entries move right going down.<br><br><span class='highlight'>Pivot variable</span>: in a column with a leading entry. <span class='highlight'>Free variable</span>: all others.",
  },
  {
    topic: "matrices",
    q: "When does \\(Ax = b\\) have no solution, a unique solution, or infinitely many solutions?",
    a: "After row-reducing \\([A\\,|\\,b]\\) to RREF:<br><br><span class='highlight'>No solution</span>: a row \\([0\\cdots 0\\,|\\,c]\\) with \\(c \\neq 0\\).<br><br><span class='highlight'>Unique</span>: no inconsistency and no free variables.<br><br><span class='highlight'>Infinitely many</span>: no inconsistency and at least one free variable.",
  },
  {
    topic: "matrices",
    q: "What are fundamental solutions and why are they important?",
    a: "Fundamental solutions of \\(Ax=0\\): for each free variable, set that variable to 1 and all other free variables to 0, then solve.<br><br><span class='highlight'>Theorem:</span> the fundamental solutions form a <span class='highlight'>basis</span> for \\(N(A)\\).",
  },
  {
    topic: "matrices",
    q: "How do you compute \\(A^{-1}\\) using RREF?",
    a: "Form the augmented matrix \\([A\\,|\\,I_n]\\) and row-reduce. If \\(A\\) reduces to \\(I_n\\), the right block becomes \\(A^{-1}\\): <span class='formula'>\\([A\\,|\\,I_n] \\xrightarrow{\\text{RREF}} [I_n\\,|\\,A^{-1}]\\)</span> If \\(A\\) does not reduce to \\(I_n\\), it is not invertible.",
  },
  {
    topic: "matrices",
    q: "State all equivalent conditions for an \\(n \\times n\\) matrix \\(A\\) to be invertible.",
    a: "The following are equivalent: <span class='highlight'>(a)</span> \\(A\\) invertible &nbsp; <span class='highlight'>(b)</span> \\(A^T\\) invertible &nbsp; <span class='highlight'>(c)</span> \\(Ax=0\\) has only \\(x=0\\) &nbsp; <span class='highlight'>(d)</span> row ops take \\(A\\) to \\(I_n\\) &nbsp; <span class='highlight'>(e)</span> \\(\\det A \\neq 0\\) &nbsp; <span class='highlight'>(f)</span> columns of \\(A\\) are linearly independent &nbsp; <span class='highlight'>(g)</span> \\(\\dim C(A) = n\\)",
  },

  // ── SUBSPACES & DIMENSION ──────────────────────────────────────────────
  {
    topic: "subspaces",
    q: "Define a subspace of \\(\\mathbb{R}^n\\). What are the three conditions?",
    a: "A non-empty subset \\(U \\subseteq \\mathbb{R}^n\\) is a <span class='highlight'>subspace</span> \\((U \\leqslant \\mathbb{R}^n)\\) if:<br><br>1. \\(0 \\in U\\)<br>2. \\(u,v \\in U \\Rightarrow u+v \\in U\\)<br>3. \\(u \\in U,\\, \\lambda \\in \\mathbb{R} \\Rightarrow \\lambda u \\in U\\)",
  },
  {
    topic: "subspaces",
    q: "Define the column space \\(C(A)\\), row space \\(C(A^T)\\), and kernel \\(N(A)\\).",
    a: "<span class='highlight'>Column space:</span> \\(C(A) = \\{Av : v \\in \\mathbb{R}^n\\}\\) — span of columns, subspace of \\(\\mathbb{R}^m\\).<br><br><span class='highlight'>Row space:</span> \\(C(A^T)\\) — span of rows, subspace of \\(\\mathbb{R}^n\\).<br><br><span class='highlight'>Kernel:</span> \\(N(A) = \\{x \\in \\mathbb{R}^n : Ax = 0\\}\\) — subspace of \\(\\mathbb{R}^n\\).",
  },
  {
    topic: "subspaces",
    q: "Define: linear combination, span, linearly independent, basis, dimension.",
    a: "<span class='highlight'>Linear combination:</span> \\(a_1v_1 + \\cdots + a_kv_k\\).<br><span class='highlight'>Span:</span> set of all linear combinations.<br><span class='highlight'>Lin. independent:</span> \\(\\sum a_iv_i = 0 \\Rightarrow\\) all \\(a_i = 0\\).<br><span class='highlight'>Basis:</span> linearly independent spanning sequence.<br><span class='highlight'>Dimension:</span> size of any basis (well-defined by Steinitz).",
  },
  {
    topic: "subspaces",
    q: "State the Extension Lemma.",
    a: "If \\(v_1,\\ldots,v_k\\) is linearly independent and \\(v \\notin \\operatorname{span}(v_1,\\ldots,v_k)\\), then <span class='formula'>\\(v_1,\\ldots,v_k,\\, v \\text{ is linearly independent.}\\)</span>",
    hint: "Proof: if \\(\\sum a_iv_i + av = 0\\) with \\(a \\neq 0\\), then \\(v \\in \\operatorname{span}(v_i)\\), contradiction."
  },
  {
    topic: "subspaces",
    q: "State the Steinitz Exchange Lemma and its corollary.",
    a: "<span class='highlight'>Steinitz:</span> If a subspace contains a spanning sequence of length \\(m\\), then every sequence of length \\(> m\\) in that subspace is linearly dependent.<br><br><span class='highlight'>Corollary:</span> Any two bases of a subspace have the same size.",
  },
  {
    topic: "subspaces",
    q: "State the Rank-Nullity Theorem.",
    a: "For any \\(m \\times n\\) matrix \\(A\\): <span class='formula'>\\(\\dim C(A) + \\dim N(A) = n\\)</span> Equivalently: \\(\\text{rank}(A) + \\text{nullity}(A) = n\\) (number of <em>columns</em>).",
  },
  {
    topic: "subspaces",
    q: "State the theorem on dimensions of subspaces.",
    a: "Let \\(U \\leqslant V \\leqslant \\mathbb{R}^n\\). Then:<br><br>(a) \\(\\dim U \\leqslant \\dim V\\)<br><br>(b) \\(\\dim U = \\dim V \\Rightarrow U = V\\)",
  },
  {
    topic: "subspaces",
    q: "State the dimension formula for the sum of two subspaces.",
    a: "For subspaces \\(S, T \\leqslant \\mathbb{R}^n\\): <span class='formula'>\\(\\dim(S+T) = \\dim S + \\dim T - \\dim(S \\cap T)\\)</span>",
    hint: "Analogous to the inclusion-exclusion formula."
  },
  {
    topic: "subspaces",
    q: "Column rank equals row rank. What does this mean?",
    a: "For any matrix \\(A\\): <span class='formula'>\\(\\dim C(A) = \\dim C(A^T)\\)</span> i.e.\ the number of linearly independent columns equals the number of linearly independent rows.",
  },
  {
    topic: "subspaces",

// ── State ──────────────────────────────────────────────────────────────────
let deck = [];
let currentIdx = 0;
let isFlipped = false;
let correctCount = 0;
let wrongCount = 0;
let currentFilter = 'all';

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function setFilter(topic, btn) {
  currentFilter = topic;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  restart();
}

function restart() {
  const filtered = currentFilter === 'all'
    ? ALL_CARDS
    : ALL_CARDS.filter(c => c.topic === currentFilter);
  deck = shuffle([...filtered]);
  currentIdx = 0;
  correctCount = 0;
  wrongCount = 0;
  isFlipped = false;
  updateScores();
  renderCard();
}

function renderCard() {
  const card = document.getElementById('card');
  const front = document.getElementById('card-front');
  const back = document.getElementById('card-back');

  card.classList.remove('flipped');
  isFlipped = false;

  if (currentIdx >= deck.length) {
    front.innerHTML = `
      <div style="text-align:center">
        <div style="font-size:48px;margin-bottom:16px">🎉</div>
        <div style="font-family:'Playfair Display',serif;font-size:24px;margin-bottom:8px">All cards complete!</div>
        <div style="color:var(--muted);font-size:14px;margin-bottom:24px">Score: ${correctCount} / ${deck.length}</div>
        <button class="btn btn-primary" onclick="restart()" style="margin:0 auto">↺ Restart</button>
      </div>`;
    back.innerHTML = '';
    updateProgress();
    return;
  }

  const c = deck[currentIdx];
  const tagClass = `tag-${c.topic}`;
  const tagNames = {
    matrices: 'Matrices & Systems',
    subspaces: 'Subspaces & Dimension',
    linear: 'Linear Maps',
    eigen: 'Eigenvalues & Det.',
    ortho: 'Orthogonality',
    proof: '★ Proof',
  };

  front.innerHTML = `
    <div class="card-label">Question</div>
    <span class="topic-tag ${tagClass}">${tagNames[c.topic]}</span>
    <div class="question-text">${c.q}</div>
    <div class="flip-hint">Click to reveal answer</div>`;

  back.innerHTML = `
    <div class="answer-label">Answer</div>
    <div class="answer-text">${c.a}</div>
    ${c.hint ? `<div class="hint">💡 ${c.hint}</div>` : ''}`;

  updateProgress();

  // Re-typeset MathJax
  if (window.MathJax) {
    MathJax.typesetPromise([front, back]).catch(err => {});
  }
}

function flipCard() {
  const card = document.getElementById('card');
  isFlipped = !isFlipped;
  card.classList.toggle('flipped', isFlipped);
}

function nextCard() {
  currentIdx++;
  isFlipped = false;
  renderCard();
}

function markCorrect() {
  correctCount++;
  updateScores();
  nextCard();
}

function markWrong() {
  wrongCount++;
  // Put the card back near the end for review
  const card = deck[currentIdx];
  deck.splice(currentIdx, 1);
  const insertAt = Math.min(deck.length, currentIdx + 3 + Math.floor(Math.random() * 3));
  deck.splice(insertAt, 0, card);
  updateScores();
  nextCard();
}

function updateProgress() {
  const total = deck.length;
  const done = Math.min(currentIdx, total);
  const pct = total > 0 ? Math.round((done / total) * 100) : 100;
  document.getElementById('progress-label').textContent = `Card ${Math.min(currentIdx + 1, total)} of ${total}`;
  document.getElementById('progress-pct').textContent = `${pct}%`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function updateScores() {
  document.getElementById('score-correct').textContent = correctCount;
  document.getElementById('score-wrong').textContent = wrongCount;
  const remaining = Math.max(0, deck.length - currentIdx);
  document.getElementById('score-remaining').textContent = remaining;
}

// ── Keyboard controls ──────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
  if (e.key === 'ArrowRight') nextCard();
  if (e.key === '1') markCorrect();
  if (e.key === '2') markWrong();
  if (e.key === 'r' || e.key === 'R') restart();
});

// ── Init ───────────────────────────────────────────────────────────────────
restart();
</script>
